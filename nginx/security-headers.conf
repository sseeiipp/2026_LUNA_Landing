# 모든 응답에 붙이는 보안 헤더. location에서 add_header를 쓰면 상위 설정이 상속되지 않으므로 각 location에서 include 한다.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 스크립트·스타일·폰트는 이 사이트에서만 받는다. 외부는 Q&A의 유튜브 영상(youtube-nocookie)과 Supabase만 허용.
# 3D 모델 로더(Spline)가 new Function을 써서 'unsafe-eval'이 필요하다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://qmevafndcgcrzpjcitxc.supabase.co https://i.ytimg.com; font-src 'self'; connect-src 'self' data: blob: https://qmevafndcgcrzpjcitxc.supabase.co; worker-src 'self' blob:; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
